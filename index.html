    <script>
      // 主题初始化:优先用户手动选择;否则按时间段自动(18:00-6:00 深色,6:00-18:00 浅色)
      (function () {
        try {
          var manual = localStorage.getItem('lusem-theme-manual');
          var t = localStorage.getItem('lusem-theme');
          if (manual === '1' && t) {
            document.documentElement.dataset.theme = t;
          } else {
            var h = new Date().getHours();
            document.documentElement.dataset.theme = (h >= 18 || h < 6) ? 'dark' : 'light';
          }
        } catch (e) {}
      })();
    </script>
